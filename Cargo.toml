[package]
name = "keepcalm"
version = "0.6.0"
edition = "2021"
description = "Simple shared types for multi-threaded programs"
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/mmastrac/keepcalm"
# Needs OnceCell/OnceLock (1.76) and inline const blocks (1.79, for project_global!)
rust-version = "1.79"

[dependencies]
serde = { version = "1", optional = true }
parking_lot = { version = "0.12.4", features = ["send_guard"] }

[dev-dependencies]
paste = "1"
smol = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt", "rt-multi-thread", "sync", "time"] }
async-std = "1"
futures = "0.3"
criterion = { version = "0.4", features = ["html_reports", "async_tokio"] }

[features]
serde = ["dep:serde"]
async_experimental = []
# Runtime lock-order (deadlock) detection. Records the order in which locks are
# acquired across the whole process and panics -- before blocking -- when an
# acquisition would create a lock-order cycle, or when a thread re-acquires a
# lock it already holds. Intended for debug/test builds: every blocking
# acquisition takes a global detector lock.
deadlock_detection = []

[[bench]]
name = "async_benchmark"
harness = false
required-features = ["async_experimental"]
